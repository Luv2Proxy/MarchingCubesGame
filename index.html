<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marching Tetrahedra Terrain Builder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud">
      <h1>Astroneer-Style Marching Tetrahedra</h1>
      <p><strong>WASD</strong> move, <strong>Space/Shift</strong> up/down, <strong>Mouse</strong> look.</p>
      <p><strong>Left Mouse</strong> build terrain, <strong>Right Mouse</strong> destroy terrain.</p>
      <p><strong>Scroll</strong> changes brush radius. Press <strong>L</strong> to lock/unlock cursor.</p>
      <div id="stats"></div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
